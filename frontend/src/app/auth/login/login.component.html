<div class="login-page">
  <!-- Animated Background -->
  <div class="bg-animation">
    <!-- Floating Circles -->
    <div class="circle-bg circle-1"></div>
    <div class="circle-bg circle-2"></div>
    <div class="circle-bg circle-3"></div>
    
    <!-- Animated Particles -->
    <div class="particles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    
    <!-- Glowing Lines -->
    <div class="glow-lines">
      <div class="line line-1"></div>
      <div class="line line-2"></div>
      <div class="line line-3"></div>
    </div>
  </div>

  <!-- Decorative Orbiting Rings -->
  <div class="orbit-container">
    <div class="orbit orbit-1">
      <div class="orbit-dot"></div>
    </div>
    <div class="orbit orbit-2">
      <div class="orbit-dot"></div>
    </div>
    <div class="orbit orbit-3">
      <div class="orbit-dot"></div>
    </div>
  </div>

  <!-- Circular Login Card -->
  <div class="login-circle">
    <!-- Animated Border -->
    <div class="card-border"></div>
    
    <!-- Top Icon with Rings -->
    <div class="top-icon">
      <div class="icon-ring ring-1"></div>
      <div class="icon-ring ring-2"></div>
      <div class="icon-ring ring-3"></div>
      <div class="icon-glow"></div>
      <div class="icon-circle">
        <mat-icon>{{ isOwnerMode ? 'real_estate_agent' : 'home' }}</mat-icon>
      </div>
    </div>

    <!-- Role Toggle -->
    <div class="role-toggle">
      <div class="toggle-bg" [class.owner]="isOwnerMode"></div>
      <button [class.active]="!isOwnerMode" (click)="setMode(false)">
        <mat-icon>person</mat-icon>
        Tenant
      </button>
      <button [class.active]="isOwnerMode" (click)="setMode(true)">
        <mat-icon>business</mat-icon>
        Owner
      </button>
    </div>

    <!-- Title with Animation -->
    <div class="title-section">
      <h2>{{ isOwnerMode ? 'Owner Login' : 'Tenant Login' }}</h2>
      <p class="subtitle">{{ isOwnerMode ? 'Manage your properties' : 'Find your dream home' }}</p>
      <div class="title-underline"></div>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onLogin(isOwnerMode ? 'owner' : 'tenant')">
      <div class="input-group">
        <div class="input-icon-wrap">
          <mat-icon>email</mat-icon>
        </div>
        <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
        <div class="input-line"></div>
      </div>

      <div class="input-group">
        <div class="input-icon-wrap">
          <mat-icon>lock</mat-icon>
        </div>
        <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
        <div class="input-line"></div>
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" />
          <span class="custom-check"></span>
          <span>Remember me</span>
        </label>
        <a href="#">Forgot?</a>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <mat-icon>error</mat-icon>
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        <span class="btn-text">{{ isLoading ? 'Logging in...' : 'Login' }}</span>
        <span class="btn-icon"><mat-icon>{{ isLoading ? 'hourglass_empty' : 'arrow_forward' }}</mat-icon></span>
        <div class="btn-shine"></div>
      </button>
    </form>

    <!-- Social -->
    <div class="social-row">
      <div class="divider-line">
        <span>or</span>
      </div>
      <button type="button" class="google-btn">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>

    <!-- Signup Link -->
    <p class="signup-link">
      New here? <a routerLink="/signup">Sign Up <mat-icon>arrow_forward</mat-icon></a>
    </p>
  </div>

  <!-- Back Button -->
  <a routerLink="/" class="back-btn">
    <mat-icon>arrow_back</mat-icon>
    <div class="btn-pulse"></div>
  </a>

  <!-- Corner Decorations -->
  <div class="corner-decor top-right">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>
  </div>
  <div class="corner-decor bottom-left">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>
  </div>
</div>

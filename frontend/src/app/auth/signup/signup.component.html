<div class="signup-container">
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
    <div class="shape shape-5"></div>
  </div>

  <div class="signup-card">
    <div class="card-header">
      <div class="signup-icon">
        <mat-icon>person_add</mat-icon>
      </div>
      <h1>Create Account</h1>
      <p>House Rental Management System</p>
    </div>

    <form (ngSubmit)="onSignup()">
      <div class="input-group">
        <mat-icon>person</mat-icon>
        <input type="text" placeholder="Full Name" [(ngModel)]="name" name="name" required />
      </div>

      <div class="input-group">
        <mat-icon>mail</mat-icon>
        <input type="email" placeholder="Email Address" [(ngModel)]="email" name="email" required />
      </div>

      <div class="input-group">
        <mat-icon>phone</mat-icon>
        <input type="tel" placeholder="Phone Number" [(ngModel)]="phone" name="phone" required />
      </div>

      <div class="input-row">
        <div class="input-group half">
          <mat-icon>lock</mat-icon>
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
        </div>
        <div class="input-group half">
          <mat-icon>lock</mat-icon>
          <input type="password" placeholder="Confirm" [(ngModel)]="confirmPassword" name="confirmPassword" required />
        </div>
      </div>

      <div class="input-group select-group">
        <mat-icon>badge</mat-icon>
        <select [(ngModel)]="role" name="role" required>
          <option value="" disabled selected>Select Role</option>
          <option value="tenant">Tenant - Looking for home</option>
          <option value="owner">Owner - List properties</option>
        </select>
      </div>

      <button type="submit" class="signup-btn">
        <mat-icon>how_to_reg</mat-icon>
        Create Account
      </button>
    </form>

    <div class="features-row">
      <div class="feature">
        <mat-icon>verified</mat-icon>
        <span>Verified</span>
      </div>
      <div class="feature">
        <mat-icon>security</mat-icon>
        <span>Secure</span>
      </div>
      <div class="feature">
        <mat-icon>support_agent</mat-icon>
        <span>24/7 Support</span>
      </div>
    </div>

    <p class="login-link">Already have an account? <a routerLink="/login">Login</a></p>

    <a routerLink="/" class="back-link">
      <mat-icon>arrow_back</mat-icon>
      Back to Home
    </a>
  </div>
</div>

<aside class="sidebar" [class.collapsed]="isSidebarCollapsed">

  <div class="brand">
    <div class="brand-left">
      <mat-icon>apartment</mat-icon>
      <span class="brand-text">Owner</span>
    </div>

    <button class="collapse-btn" (click)="toggleSidebar()">
      <mat-icon>
        {{ isSidebarCollapsed ? 'chevron_right' : 'chevron_left' }}
      </mat-icon>
    </button>
  </div>

  <nav class="menu">

    <a
      routerLink="/owner/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/owner/properties"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>home_work</mat-icon>
      <span>My Properties</span>
    </a>

    <a
      routerLink="/owner/add-property"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>add_circle_outline</mat-icon>
      <span>Add Property</span>
    </a>

    <!-- NOTE: Edit Property should not navigate -->
    <a
      routerLink="/owner/edit-property"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>edit</mat-icon>
      <span>Edit Property</span>
    </a>

    <a
      routerLink="/owner/bookings"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>event</mat-icon>
      <span>Booking Requests</span>
    </a>

    <a
      routerLink="/owner/profile"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>person</mat-icon>
      <span>Owner Profile</span>
    </a>

  </nav>

</aside>

<div class="tenant-layout">
  <div class="details-container" *ngIf="property">

    <div class="details-card">

      <!-- Property Image -->
      <img
        [src]="property.image"
        alt="Property Image"
        class="property-image"
      />

      <!-- Content -->
      <div class="details-content">

        <h2>{{ property.title }}</h2>

        <p><strong>Location:</strong> {{ property.location }}</p>
        <p><strong>Rent:</strong> ₹{{ property.rent }}</p>

        <div class="amenities">
          <strong>Amenities</strong>
          <ul>
            <li *ngFor="let a of property.amenities">{{ a }}</li>
          </ul>
        </div>

        <!-- Actions -->
        <div class="actions">
          <button
            mat-raised-button
            class="primary-btn"
            [routerLink]="['/booking-request', property.id]"
          >
            Request Booking
          </button>

          <button
            mat-stroked-button
            class="secondary-btn"
            routerLink="/properties"
          >
            Back
          </button>
        </div>

      </div>

    </div>

  </div>
</div>

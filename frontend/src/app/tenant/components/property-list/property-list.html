<div class="property-list-page">

  <h2 class="page-title">Available Properties</h2>

  <!-- ================= FILTERS ================= -->
  <div class="filters">

    <mat-form-field appearance="outline">
      <mat-label>Location</mat-label>
      <input matInput [(ngModel)]="location" placeholder="Enter location" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Max Budget</mat-label>
      <input matInput type="number" [(ngModel)]="maxBudget" placeholder="Enter max rent" />
    </mat-form-field>

  <mat-form-field appearance="outline">
  <mat-label>Amenities</mat-label>

  <mat-select [(ngModel)]="amenity">
    <mat-option [value]="null">All</mat-option>
    <mat-option value="Parking">Parking</mat-option>
    <mat-option value="Lift">Lift</mat-option>
    <mat-option value="Power Backup">Power Backup</mat-option>
    <mat-option value="Garden">Garden</mat-option>
  </mat-select>
</mat-form-field>



    <button mat-raised-button class="search-btn" (click)="filterProperties()">
      Search
    </button>

  </div>

  <!-- ================= PROPERTY GRID ================= -->
  <div class="property-grid">

    <mat-card class="property-card" *ngFor="let property of filteredProperties">

      <img mat-card-image [src]="property.image" alt="Property Image" />

      <mat-card-content>
        <h3>{{ property.title }}</h3>

        <p><strong>Location:</strong> {{ property.location }}</p>
        <p><strong>Rent:</strong> ₹{{ property.rent }}</p>
        <p><strong>Amenities:</strong> {{ property.amenities.join(', ') }}</p>
      </mat-card-content>

      <mat-card-actions>

        <!-- ✅ CORRECT ROUTES -->
        <button
          mat-stroked-button
          color="primary"
          [routerLink]="['/property', property.id]">
          View Details
        </button>

        <button
          mat-raised-button
          color="primary"
          [routerLink]="['/booking-request', property.id]">
          Request Booking
        </button>

      </mat-card-actions>

    </mat-card>

  </div>

  <!-- ================= EMPTY STATE ================= -->
  <div class="no-results" *ngIf="filteredProperties.length === 0">
    No properties found.
  </div>

</div>

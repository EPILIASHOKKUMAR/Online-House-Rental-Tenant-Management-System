<div class="tenant-layout">
  <div class="page-container">

    <h2 class="page-title">Booking Request</h2>

    <form *ngIf="!submitted" class="form-card">

      <!-- Tenant Name -->
      <mat-form-field appearance="outline">
        <mat-label>Tenant Name</mat-label>
        <input
          matInput
          [(ngModel)]="booking.tenantName"
          name="tenantName"
          required>
      </mat-form-field>

      <!-- Email -->
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          [(ngModel)]="booking.email"
          name="email"
          required>
      </mat-form-field>

      <!-- Phone -->
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input
          matInput
          type="tel"
          [(ngModel)]="booking.phone"
          name="phone"
          required>
      </mat-form-field>

      <!-- Move-in Date (DD-MM-YYYY) -->
      <mat-form-field appearance="outline">
        <mat-label>Move-in Date</mat-label>

        <input
          matInput
          [matDatepicker]="picker"
          [(ngModel)]="booking.moveInDate"
          name="moveInDate"
          placeholder="DD-MM-YYYY"
          required>

        <mat-datepicker-toggle
          matSuffix
          [for]="picker">
        </mat-datepicker-toggle>

        <mat-datepicker #picker></mat-datepicker>

        <mat-hint>DD-MM-YYYY</mat-hint>
      </mat-form-field>

      <!-- Submit Button -->
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="submitBooking()">
        Submit Booking
      </button>

    </form>

    <!-- Success Message -->
    <div *ngIf="submitted" class="success-box">
      <h3>✅ Booking Submitted</h3>
      <p>Status: <strong>{{ booking.status }}</strong></p>
    </div>

  </div>
</div>

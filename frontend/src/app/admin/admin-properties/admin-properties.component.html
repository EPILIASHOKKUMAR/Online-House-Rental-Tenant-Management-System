<div class="admin-layout">
  <mat-toolbar class="admin-header">
    <mat-icon>admin_panel_settings</mat-icon>
    <span class="header-title">Admin Panel</span>
    <span class="spacer"></span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-toolbar>

  <div class="admin-body">
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav mode="side" opened class="sidebar">
        <div class="sidebar-menu">
          <a routerLink="/admin/dashboard" class="menu-item">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>
          <a routerLink="/admin/users" class="menu-item">
            <mat-icon>people</mat-icon>
            <span>Users</span>
          </a>
          <a routerLink="/admin/properties" class="menu-item active">
            <mat-icon>apartment</mat-icon>
            <span>Properties</span>
          </a>
        </div>
      </mat-sidenav>

      <mat-sidenav-content class="main-content">
        <div class="page-content">
          <h2 class="page-title">
            <mat-icon>apartment</mat-icon>
            Properties Monitoring
          </h2>
          
          <mat-card class="table-card">
            <mat-card-content>
              <table mat-table [dataSource]="properties" class="data-table">
                <ng-container matColumnDef="id">
                  <th mat-header-cell *matHeaderCellDef>Property ID</th>
                  <td mat-cell *matCellDef="let prop">#{{ prop.id }}</td>
                </ng-container>

                <ng-container matColumnDef="title">
                  <th mat-header-cell *matHeaderCellDef>Title</th>
                  <td mat-cell *matCellDef="let prop">{{ prop.title }}</td>
                </ng-container>

                <ng-container matColumnDef="location">
                  <th mat-header-cell *matHeaderCellDef>Location</th>
                  <td mat-cell *matCellDef="let prop">
                    <mat-icon class="location-icon">location_on</mat-icon>
                    {{ prop.location }}
                  </td>
                </ng-container>

                <ng-container matColumnDef="rent">
                  <th mat-header-cell *matHeaderCellDef>Rent</th>
                  <td mat-cell *matCellDef="let prop" class="rent-cell">₹{{ prop.rent | number }}</td>
                </ng-container>

                <ng-container matColumnDef="ownerId">
                  <th mat-header-cell *matHeaderCellDef>Owner ID</th>
                  <td mat-cell *matCellDef="let prop">{{ prop.ownerId }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="propertyColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: propertyColumns;"></tr>
              </table>
            </mat-card-content>
          </mat-card>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</div>

<div class="admin-container">
  <h1>Admin Dashboard</h1>
  
  <!-- Users Section -->
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Users List</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="users" class="users-table">
        
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>User ID</th>
          <td mat-cell *matCellDef="let user">{{ user.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let user">{{ user.name }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">{{ user.role }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: userColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>

  <!-- Properties Section -->
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Properties List</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="properties" class="properties-table">
        
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Property ID</th>
          <td mat-cell *matCellDef="let prop">{{ prop.id }}</td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let prop">{{ prop.title }}</td>
        </ng-container>

        <ng-container matColumnDef="location">
          <th mat-header-cell *matHeaderCellDef>Location</th>
          <td mat-cell *matCellDef="let prop">{{ prop.location }}</td>
        </ng-container>

        <ng-container matColumnDef="rent">
          <th mat-header-cell *matHeaderCellDef>Rent</th>
          <td mat-cell *matCellDef="let prop">₹{{ prop.rent }}</td>
        </ng-container>

        <ng-container matColumnDef="ownerId">
          <th mat-header-cell *matHeaderCellDef>Owner ID</th>
          <td mat-cell *matCellDef="let prop">{{ prop.ownerId }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="propertyColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: propertyColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>

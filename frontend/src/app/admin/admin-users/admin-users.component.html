<div class="admin-layout">
  <mat-toolbar class="admin-header">
    <mat-icon>admin_panel_settings</mat-icon>
    <span class="header-title">Admin Panel</span>
    <span class="spacer"></span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </mat-toolbar>

  <div class="admin-body">
    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav mode="side" opened class="sidebar">
        <div class="sidebar-menu">
          <a routerLink="/admin/dashboard" class="menu-item">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>
          <a routerLink="/admin/users" class="menu-item active">
            <mat-icon>people</mat-icon>
            <span>Users</span>
          </a>
          <a routerLink="/admin/properties" class="menu-item">
            <mat-icon>apartment</mat-icon>
            <span>Properties</span>
          </a>
        </div>
      </mat-sidenav>

      <mat-sidenav-content class="main-content">
        <div class="page-content">
          <h2 class="page-title">
            <mat-icon>people</mat-icon>
            Users Monitoring
          </h2>
          
          <mat-card class="table-card">
            <mat-card-content>
              <table mat-table [dataSource]="users" class="data-table">
                <ng-container matColumnDef="id">
                  <th mat-header-cell *matHeaderCellDef>User ID</th>
                  <td mat-cell *matCellDef="let user">#{{ user.id }}</td>
                </ng-container>

                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef>Name</th>
                  <td mat-cell *matCellDef="let user">{{ user.name }}</td>
                </ng-container>

                <ng-container matColumnDef="role">
                  <th mat-header-cell *matHeaderCellDef>Role</th>
                  <td mat-cell *matCellDef="let user">
                    <span class="role-badge" [class.tenant]="user.role === 'Tenant'" [class.owner]="user.role === 'Owner'">
                      <mat-icon>{{ getRoleIcon(user.role) }}</mat-icon>
                      {{ user.role }}
                    </span>
                  </td>
                </ng-container>

                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef>Email</th>
                  <td mat-cell *matCellDef="let user">{{ user.email }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="userColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: userColumns;"></tr>
              </table>
            </mat-card-content>
          </mat-card>
        </div>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
</div>
